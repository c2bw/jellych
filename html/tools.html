<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <title>Tools - Jellych</title>
  <link rel="icon" href="/html/assets/img/twitch_jellyfish_icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/html/assets/app.css" />
</head>
<body class="app-body">
  <div class="app-frame library-frame">
    <header class="site-header">
      <a href="/" class="brand" aria-label="Jellych home">
        <span class="brand-mark"><img src="/html/assets/img/twitch_jellyfish_icon.svg" alt="" /></span>
        <span class="brand-copy">
          <strong>Jellych</strong>
          <span>Stream tools</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/watch" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          Live
        </a>
        <a href="/vods" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5zM9 9v6l6-3z" /></svg>
          VODs
        </a>
        <span class="nav-link is-active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></svg>
          Tools
        </span>
      </nav>
    </header>

    <main class="tools-layout">
      <section class="surface-card add-vod-card">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Direct proxy</span>
            <h1>View a livestream</h1>
            <p>Watch any live Twitch channel in the web player without adding it to followed channels or Jellyfin.</p>
          </div>
        </div>
        <form id="viewStreamForm" class="vod-form">
          <label class="field-label" for="streamChannelInput">Channel or Twitch URL</label>
          <input id="streamChannelInput" class="field" type="text" placeholder="channel or https://www.twitch.tv/channel" autocomplete="off" spellcheck="false" required />
          <button id="viewStreamBtn" class="button button-primary" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            View stream
          </button>
          <div id="viewStreamMsg" class="form-message" aria-live="polite"></div>
        </form>
      </section>

      <section class="surface-card add-vod-card">
        <div class="section-heading">
          <div>
            <span class="eyebrow">URL extractor</span>
            <h2>Extract stream URL</h2>
            <p>Resolve the raw Twitch backend HLS (.m3u8) URL for any live channel.</p>
          </div>
        </div>
        <form id="extractUrlForm" class="vod-form">
          <label class="field-label" for="extractChannelInput">Channel or Twitch URL</label>
          <input id="extractChannelInput" class="field" type="text" placeholder="channel or https://www.twitch.tv/channel" autocomplete="off" spellcheck="false" required />
          <button id="extractUrlBtn" class="button button-primary" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>
            Get stream URL
          </button>
          <div id="extractUrlMsg" class="form-message" aria-live="polite"></div>
        </form>

        <div id="extractUrlResult" class="settings-block hidden">
          <div class="settings-heading">
            <span class="eyebrow">Backend HLS URL</span>
            <button id="copyStreamUrlBtn" class="button compact-button" type="button">Copy URL</button>
          </div>
          <code id="extractedStreamUrl" class="command-preview"></code>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/html/js/tools.js"></script>
</body>
</html>
