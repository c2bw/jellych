<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <title>Live - Jellych</title>
  <link rel="icon" href="/html/assets/img/twitch_jellyfish_icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/html/assets/app.css" />
</head>
<body class="app-body watch-body">
  <div class="app-frame watch-frame">
    <header class="site-header">
      <a href="/" class="brand" aria-label="Jellych home">
        <span class="brand-mark"><img src="/html/assets/img/twitch_jellyfish_icon.svg" alt="" /></span>
        <span class="brand-copy">
          <strong>Jellych</strong>
          <span>Stream console</span>
        </span>
      </a>
      <div class="header-actions">
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/watch" class="nav-link is-active" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            Live
          </a>
          <a href="/vods" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5zM9 9v6l6-3z" /></svg>
            VODs
          </a>
          <a href="/tools" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></svg>
            Tools
          </a>
        </nav>
        <button id="chatToggle" class="nav-link chat-toggle" type="button" aria-controls="chatPanel" aria-pressed="false" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" /></svg>
          <span id="chatToggleLabel">Show chat</span>
        </button>
      </div>
    </header>

    <main class="watch-layout">
      <aside class="control-rail">
        <section id="statsOverlay" class="surface-card stats-card">
          <div class="section-heading compact-heading">
            <div>
              <span class="eyebrow">Playback</span>
              <h2>Signal health</h2>
            </div>
            <div id="statsState" class="stats-chip">Idle</div>
          </div>
          <div id="statsGrid" class="stats-grid"></div>
        </section>

        <section id="manager" class="surface-card manager-card">
          <div class="section-heading compact-heading">
            <div>
              <span class="eyebrow">Sources</span>
              <h2>Manage channels</h2>
            </div>
          </div>
          <div class="manager-controls">
            <div class="control-group">
              <input id="newName" placeholder="Channel name" class="field compact-field" aria-label="Channel name" />
              <button id="addBtn" class="button button-primary compact-button" type="button">Add</button>
            </div>
            <div class="control-group">
              <select id="removeSelect" class="field compact-field" aria-label="Channel to remove"></select>
              <button id="removeBtn" class="button compact-button" type="button">Remove</button>
            </div>
            <div id="managerMsg" class="form-message" aria-live="polite"></div>
          </div>
        </section>

        <section id="channels" class="surface-card channels-card">
          <div class="section-heading channels-heading">
            <div>
              <span class="eyebrow">Directory</span>
              <h2>Channels</h2>
            </div>
            <button id="multiToggle" class="btn-base multi-toggle" type="button" aria-pressed="false" title="Play multiple streams simultaneously">
              Multi
            </button>
          </div>
          <div id="multiToolbar" class="multi-toolbar hidden" role="toolbar" aria-label="Stream tiling layout">
            <div class="multi-toolbar-left">
              <span class="eyebrow">Tiling</span>
              <span id="multiCount" class="multi-count-badge">0 streams</span>
            </div>
            <div class="multi-layout-group">
              <button type="button" class="multi-layout-btn is-active" data-layout-option="auto" aria-pressed="true" title="Automatic grid">Auto</button>
              <button type="button" class="multi-layout-btn" data-layout-option="spotlight" aria-pressed="false" title="Primary spotlight with secondary tiles">Spotlight</button>
              <button type="button" class="multi-layout-btn" data-layout-option="columns" aria-pressed="false" title="Side-by-side columns">Side-by-side</button>
              <button type="button" class="multi-layout-btn" data-layout-option="stacked" aria-pressed="false" title="Stacked rows">Stacked</button>
            </div>
          </div>
          <div id="channelsList" class="channel-list">Loading channels…</div>
        </section>
      </aside>

      <div class="viewer-shell">
        <section class="player-column" aria-label="Stream player">
          <div id="playerGrid" class="player-grid" data-layout="auto" data-count="0">
            <div id="playerStage" class="player-stage" tabindex="0">
              <div id="playerTitle" class="player-title hidden" data-control="title-bar">
                <div class="truncate" data-control="title-text"></div>
                <div class="tile-actions hidden" data-control="tile-actions">
                  <button type="button" class="tile-action-btn" data-tile-action="spotlight" title="Spotlight this stream" aria-label="Spotlight stream">★</button>
                  <button type="button" class="tile-action-btn" data-tile-action="move-prev" title="Move tile earlier" aria-label="Move tile earlier">←</button>
                  <button type="button" class="tile-action-btn" data-tile-action="move-next" title="Move tile later" aria-label="Move tile later">→</button>
                  <button type="button" class="tile-action-btn tile-action-close" data-tile-action="close" title="Close stream tile" aria-label="Close stream tile">×</button>
                </div>
              </div>
              <video id="player" playsinline preload="metadata"></video>
              <div class="player-idle" aria-hidden="true">
                <img src="/html/assets/img/twitch_jellyfish_icon.svg" alt="" />
                <span>Select a live channel to begin</span>
              </div>
              <button id="playerCenterPlay" data-control="center-play" class="player-center-play hidden" type="button" aria-label="Play stream">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              </button>
              <div id="playerControls" class="player-controls">
                <div class="player-controls-left">
                  <button id="playerPlayToggle" data-control="play-toggle" class="player-control-button" type="button" aria-label="Play" disabled>
                    <svg class="player-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                    <svg class="player-icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM14 5h3v14h-3z" /></svg>
                  </button>
                  <button id="playerLiveBadge" data-control="live-badge" class="player-live-badge" type="button" title="At live edge" aria-label="Live edge" disabled>
                    <i></i>
                    <span data-control="live-badge-text">Live</span>
                  </button>
                  <div id="playerTimeControls" data-control="time-controls" class="player-time-controls hidden" role="group" aria-label="Stream time sync controls">
                    <button data-control="seek-back" class="player-step-button" type="button" title="Rewind 1 second" aria-label="Rewind 1 second" disabled>-1s</button>
                    <input data-control="seek-range" class="player-seek-range" type="range" min="-30" max="0" step="0.5" value="0" aria-label="Stream time offset" disabled />
                    <button data-control="seek-forward" class="player-step-button" type="button" title="Forward 1 second" aria-label="Forward 1 second" disabled>+1s</button>
                  </div>
                  <button id="playerLowLatencyToggle" data-control="low-latency-toggle" class="player-latency-toggle" type="button" aria-pressed="false" title="Use an approximately two-second live buffer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-8 12h6l-1 8 9-13h-6z" /></svg>
                    <span>Low latency</span>
                  </button>
                </div>
                <div class="player-controls-right">
                  <div class="player-volume">
                    <button id="playerMuteToggle" data-control="mute-toggle" class="player-control-button" type="button" aria-label="Mute">
                      <svg class="player-icon-volume" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9zm12.5.5a4 4 0 0 1 0 5M19.5 7a7 7 0 0 1 0 10" /></svg>
                      <svg class="player-icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9zm12 1 4 4m0-4-4 4" /></svg>
                    </button>
                    <input id="playerVolume" data-control="volume-range" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
                  </div>
                  <button id="playerPipToggle" data-control="pip-toggle" class="player-control-button" type="button" aria-label="Picture in picture" title="Picture in picture">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM12 12h6v5h-6z" /></svg>
                  </button>
                  <button id="playerFullscreenToggle" data-control="fullscreen-toggle" class="player-control-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
                    <svg class="player-icon-expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
                    <svg class="player-icon-collapse" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5" /></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside id="chatPanel" class="surface-card chat-panel" aria-labelledby="chatChannel" tabindex="-1" hidden>
          <header class="chat-header">
            <div>
              <span class="eyebrow">Twitch IRC</span>
              <h2 id="chatChannel">Chat</h2>
            </div>
            <span id="chatStatus" class="chat-status" data-state="idle" aria-live="polite">Idle</span>
          </header>
          <div class="chat-auth-bar">
            <span id="chatIdentity">Anonymous · read only</span>
            <button id="chatAuthButton" class="chat-auth-button" type="button">Log in</button>
          </div>
          <div class="chat-feed">
            <div id="chatMessages" class="chat-messages" role="log" aria-label="Twitch chat messages"></div>
            <div id="chatEmpty" class="chat-empty">Select a live channel to view chat</div>
            <button id="chatNewMessages" class="chat-new-messages hidden" type="button">New messages</button>
          </div>
          <form id="chatComposer" class="chat-composer is-disabled" autocomplete="off">
            <input id="chatInput" type="text" maxlength="450" placeholder="Log in to send messages" aria-label="Chat message" disabled />
            <button id="chatSendButton" type="submit" disabled>Send</button>
          </form>
        </aside>
      </div>
    </main>
  </div>

  <script src="/html/vendor/hls.min.js"></script>
  <script type="module" src="/html/js/index.js"></script>
</body>
</html>
